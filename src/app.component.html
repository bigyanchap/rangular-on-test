<screen>
  <section>
    <section class="prow">
      <section class="disc" (click)="mark(1)"><label class="disc-num">1</label></section>
      <section class="disc" (click)="mark(2)"><label class="disc-num">2</label></section>
      <section class="disc" (click)="mark(3)"><label class="disc-num">3</label></section>
    </section>
    <section class="prow">
      <section class="disc" (click)="mark(4)"><label class="disc-num">4</label></section>
      <section class="disc" (click)="mark(5)"><label class="disc-num">5</label></section>
      <section class="disc" (click)="mark(6)"><label class="disc-num">6</label></section>
    </section>
    <section class="prow">
      <section class="disc" (click)="mark(7)"><label class="disc-num">7</label></section>
      <section class="disc" (click)="mark(8)"><label class="disc-num">8</label></section>
      <section class="disc" (click)="mark(9)"><label class="disc-num">9</label></section>
    </section>
    <p>Tapped:{{ hit }}</p>
  </section>
</screen>
